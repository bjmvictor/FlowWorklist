name: Publish GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Publish docs/wiki
    runs-on: ubuntu-latest

    steps:
      - name: Check out the main repository
        uses: actions/checkout@v4

      - name: Clone the GitHub Wiki repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            .wiki-repository

      - name: Copy documentation pages
        run: |
          rsync --archive \
            --exclude ".git/" \
            docs/wiki/ \
            .wiki-repository/

      - name: Publish changes
        working-directory: .wiki-repository
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The GitHub Wiki is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: sync wiki from main repository"
          git push
